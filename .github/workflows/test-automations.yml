name: KG Agent Test Automations

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  config-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/unit/test_config.py -v

  gcs-path-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest tests/unit/test_gcs_paths.py -v

  summary-record-test:
